<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b67d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Riko English">
<link rel="manifest" href="manifest.json">
<title>Riko English</title>
<style>
:root{--bg:#f7f5f1;--card:#fff;--text:#242424;--muted:#777;--accent:#5b67d8;--line:#e8e5df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;padding:22px 18px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
h1{font-size:26px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 3px 12px #00000008}
.badge{display:inline-block;background:#eeeefb;color:var(--accent);font-size:12px;padding:5px 9px;border-radius:999px;font-weight:700}
.quote{font-size:21px;font-weight:700;line-height:1.5;margin:14px 0 8px}.jp{color:var(--muted);line-height:1.6}
button{border:0;border-radius:12px;padding:12px 15px;font-size:14px;font-weight:700;cursor:pointer;background:#eee;color:#333}
.primary{background:var(--accent);color:white;width:100%;margin-top:12px}.row{display:flex;gap:8px}.row button{flex:1}
.hidden{display:none}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));z-index:3}
.tabs button{background:transparent;color:#777}.tabs button.active{color:var(--accent);background:#f0f0ff}
.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:15px;margin:7px 0 10px}
.answer{font-size:20px;font-weight:700;text-align:center;padding:16px 5px}.small{font-size:12px;color:var(--muted)}
.stat{font-size:30px;font-weight:800}.list-item{padding:14px 0;border-bottom:1px solid var(--line)}.list-item:last-child{border-bottom:0}
</style>
</head>
<body>
<div class="app">
  <div id="home">
    <div class="top"><div><h1>Riko English</h1><div class="sub">映画で覚える、私だけの英語</div></div><span class="badge">Day <span id="day">1</span></span></div>
    <div class="card">
      <span class="badge">今日の10分</span>
      <div class="quote" id="todayQuote"></div>
      <div class="jp" id="todayJp"></div>
      <button class="primary" onclick="go('study')">今日の学習を始める</button>
    </div>
    <div class="row">
      <div class="card" style="flex:1"><div class="small">学習日数</div><div class="stat" id="days">0</div></div>
      <div class="card" style="flex:1"><div class="small">覚えた表現</div><div class="stat" id="count">4</div></div>
    </div>
    <div class="card">
      <span class="badge">最近の表現</span>
      <div id="recent"></div>
    </div>
  </div>

  <div id="study" class="hidden">
    <div class="top"><div><h1>今日の学習</h1><div class="sub">まず意味をイメージしてみよう</div></div></div>
    <div class="card">
      <span class="badge">映画のセリフ</span>
      <div class="quote" id="studyQuote"></div>
      <div class="jp hidden" id="studyJp"></div>
      <button class="primary" id="showBtn" onclick="showMeaning()">意味を見る</button>
      <div class="row" id="studyBtns" style="display:none;margin-top:10px">
        <button onclick="mark(false)">まだ不安</button><button onclick="mark(true)">覚えた！</button>
      </div>
    </div>
    <div class="card">
      <span class="badge">ポイント</span>
      <div id="point" class="jp" style="margin-top:10px"></div>
    </div>
  </div>

  <div id="quiz" class="hidden">
    <div class="top"><div><h1>復習クイズ</h1><div class="sub">思い出せるかな？</div></div></div>
    <div class="card">
      <div class="small" id="qNum"></div>
      <div class="quote" id="qText"></div>
      <input class="input" id="qInput" placeholder="英語で答えてみて">
      <button class="primary" onclick="checkQuiz()">答え合わせ</button>
      <div id="qResult" class="answer"></div>
    </div>
  </div>

  <div id="phrases" class="hidden">
    <div class="top"><div><h1>My Phrases</h1><div class="sub">映画から拾った表現</div></div></div>
    <div class="card" id="phraseList"></div>
  </div>
</div>

<div class="tabs">
  <button id="t-home" onclick="go('home')">ホーム</button>
  <button id="t-study" onclick="go('study')">学習</button>
  <button id="t-quiz" onclick="go('quiz')">クイズ</button>
  <button id="t-phrases" onclick="go('phrases')">表現帳</button>
</div>

<script>
const phrases=[
 {en:"So do I.",jp:"私もそうだよ。",point:"肯定文に対して「私も！」と言う定番表現。"},
 {en:"No matter what.",jp:"何があっても／何であろうと。",point:"no matter + 疑問詞で「どんな〜でも」。"},
 {en:"You better make damn sure.",jp:"絶対ちゃんと確認しろよ。",point:"You better ～ は強い警告。damn が強調を加える。"},
 {en:"You better make damn sure you kill me this time.",jp:"今度こそ、絶対に俺を殺せよ。",point:"make sure = 確実にする。this time = 今度こそ。かなり強い言い方。"}
];
let studyIndex=0, quizIndex=0;
let learned=JSON.parse(localStorage.getItem("rikoLearned")||"[]");
let studyDays=Number(localStorage.getItem("rikoDays")||0);

function render(){
 document.getElementById("todayQuote").textContent=phrases[studyIndex].en;
 document.getElementById("todayJp").textContent=phrases[studyIndex].jp;
 document.getElementById("studyQuote").textContent=phrases[studyIndex].en;
 document.getElementById("point").textContent=phrases[studyIndex].point;
 document.getElementById("days").textContent=studyDays;
 document.getElementById("count").textContent=phrases.length;
 document.getElementById("day").textContent=Math.max(1,studyDays+1);
 document.getElementById("recent").innerHTML=phrases.slice().reverse().map(p=>`<div class="list-item"><b>${p.en}</b><br><span class="small">${p.jp}</span></div>`).join("");
 document.getElementById("phraseList").innerHTML=phrases.map(p=>`<div class="list-item"><b>${p.en}</b><br><span class="small">${p.jp}</span><br><span class="small">${p.point}</span></div>`).join("");
}
function go(id){
 ["home","study","quiz","phrases"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id));
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
 document.getElementById("t-"+id).classList.add("active");
 if(id==="study") resetStudy();
 if(id==="quiz") resetQuiz();
}
function resetStudy(){
 document.getElementById("studyJp").textContent=phrases[studyIndex].jp;
 document.getElementById("studyJp").classList.add("hidden");
 document.getElementById("showBtn").style.display="block";
 document.getElementById("studyBtns").style.display="none";
 document.getElementById("studyQuote").textContent=phrases[studyIndex].en;
 document.getElementById("point").textContent=phrases[studyIndex].point;
}
function showMeaning(){
 document.getElementById("studyJp").classList.remove("hidden");
 document.getElementById("showBtn").style.display="none";
 document.getElementById("studyBtns").style.display="flex";
}
function mark(ok){
 if(ok && !learned.includes(studyIndex)) learned.push(studyIndex);
 localStorage.setItem("rikoLearned",JSON.stringify(learned));
 studyDays++; localStorage.setItem("rikoDays",studyDays);
 studyIndex=(studyIndex+1)%phrases.length; render(); resetStudy();
}
function resetQuiz(){
 quizIndex=Math.floor(Math.random()*phrases.length);
 document.getElementById("qNum").textContent="日本語を英語にしてみよう";
 document.getElementById("qText").textContent=phrases[quizIndex].jp;
 document.getElementById("qInput").value="";
 document.getElementById("qResult").textContent="";
}
function checkQuiz(){
 const ans=document.getElementById("qInput").value.trim().toLowerCase();
 const correct=phrases[quizIndex].en.toLowerCase();
 document.getElementById("qResult").innerHTML=ans===correct
 ? "正解！"
 : `答え：<br>${phrases[quizIndex].en}`;
}
render(); go("home");
</script>
</body>
</html>
